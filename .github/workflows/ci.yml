name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  PYTHON_VERSION: "3.13"

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Кодыг татах (Checkout)
        uses: actions/checkout@v4

      - name: Python суулгах
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Хамаарлуудыг суулгах
        run: pip install -r requirements-dev.txt

      - name: flake8 lint шалгах
        run: flake8 apps config --max-line-length=100 --exclude=migrations

      - name: pytest тест ажиллуулах (coverage >= 80%)
        run: pytest --cov=apps --cov-report=term-missing --cov-fail-under=80

  build:
    name: Docker Image Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Кодыг татах (Checkout)
        uses: actions/checkout@v4

      - name: GitHub Container Registry-д нэвтрэх
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx тохируулах
        uses: docker/setup-buildx-action@v3

      - name: Docker image build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
