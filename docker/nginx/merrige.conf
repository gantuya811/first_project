# ============================================================
# MERRIGE ERP - Nginx reverse proxy тохиргоо
# Static/Media файлыг шууд Nginx-ээс, бусад бүх хүсэлтийг Gunicorn
# (web service)-рүү дамжуулна.
# ============================================================

upstream merrige_backend {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://merrige_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
