<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f6fa; font-family: Arial, Helvetica, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f6fa; padding:24px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff; border-radius:12px; overflow:hidden;">
                    <tr>
                        <td style="background-color:#1f2937; padding:20px 24px;">
                            <span style="color:#ffffff; font-size:18px; font-weight:bold;">MERRIGE ERP</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px;">
                            <p style="font-size:16px; color:#111827; margin:0 0 8px 0;">
                                Сайн байна уу, {{ user.first_name }}!
                            </p>
                            <h2 style="font-size:18px; color:#1f2937; margin:16px 0 8px 0;">{{ title }}</h2>
                            <p style="font-size:14px; color:#374151; line-height:1.6; margin:0;">{{ message }}</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 24px; background-color:#f3f4f6;">
                            <p style="font-size:12px; color:#6b7280; margin:0;">
                                Энэ имэйлийг MERRIGE ERP систем автоматаар илгээсэн болно.
                                Хариу бичих шаардлагагүй.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
